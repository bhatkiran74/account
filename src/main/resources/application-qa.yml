account:
  name: account-service-qa
  version: 1.0.0
  description: Account Service for managing user accounts
  contact:
    name: Kiransing Bhat
    email: bhatkiran74@gmail.com


server:
  port: 9091

spring:
  application:
    name: account-service

    config:
      active:
        on-profile: "qa"

  datasource:
    url: jdbc:mysql://localhost:3306/account?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    deep-linking: true
    show-common-extensions: true
  show-actuator: false
  use-fqn: true


build:
  info: 10.10.11-snapshot